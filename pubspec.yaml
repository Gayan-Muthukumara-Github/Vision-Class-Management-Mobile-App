name: visionclass
description: A comprehensive class management system with admin, teacher, and student modules
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # State Management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0

  # Platform detection
  flutter_platform_widgets: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true